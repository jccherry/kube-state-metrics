name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  helm-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deployment/helm/kube-state-metrics/

      - name: Helm template (dry-run)
        run: |
          helm template kube-state-metrics deployment/helm/kube-state-metrics/ \
            --namespace kube-state-metrics \
            --debug
